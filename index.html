<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="weather-container">
      <div class="weather-card">
        <div class="header">
          <h1>Weather App</h1>
          <p>Check the current weather anywhere</p>
        </div>

        <form onsubmit="fetchData(event)" class="search-box">
          <input
            type="text"
            id="input"
            placeholder="Enter city name..."
            required
          />

          <button type="submit">Search</button>
        </form>

        <div class="weather-result">
          <div class="location">
            <h2 id="city"></h2>
            <p id="country"></p>
          </div>

          <div class="temperature">
            <span id="temp"></span>
            <span></span>
          </div>

          <div class="condition">
            <img id="weather-icon" src="" alt="☀️" />
            <p id="condition"></p>
          </div>

          <div class="weather-info">
            <div class="info-box">
              <span>💧</span>
              <p>Humidity</p>
              <strong id="humidity"></strong>
            </div>

            <div class="info-box">
              <span>💨</span>
              <p>Wind</p>
              <strong id="wind"></strong>
            </div>

            <div class="info-box">
              <span>🌡️</span>
              <p>Feels Like</p>
              <strong id="feels"></strong>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
